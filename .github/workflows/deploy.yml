name: Deploy portfolio to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload built website
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_WEBROOT: ${{ secrets.HOSTINGER_WEBROOT }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Restrict values used in remote paths and commands.
          [[ "$HOSTINGER_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$HOSTINGER_PORT" =~ ^[0-9]+$ ]]
          [[ "$HOSTINGER_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$HOSTINGER_WEBROOT" =~ ^/[a-zA-Z0-9_./-]+/public_html/?$ ]]
          test -s dist/index.html

          key_file="$RUNNER_TEMP/hostinger_key"
          hosts_file="$RUNNER_TEMP/hostinger_known_hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT

          umask 077
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$key_file"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$hosts_file"

          connection_options=(
            -i "$key_file"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$hosts_file"
          )
          destination="$HOSTINGER_USER@$HOSTINGER_HOST"
          webroot="${HOSTINGER_WEBROOT%/}"

          # Upload assets before switching the page to the new build.
          shopt -s nullglob dotglob
          for entry in dist/*; do
            [[ "$(basename "$entry")" == "index.html" ]] && continue
            scp "${connection_options[@]}" -P "$HOSTINGER_PORT" \
              -r "$entry" "$destination:$webroot/"
          done

          scp "${connection_options[@]}" -P "$HOSTINGER_PORT" \
            dist/index.html "$destination:$webroot/index.html.next"

          ssh "${connection_options[@]}" -p "$HOSTINGER_PORT" \
            "$destination" \
            "mv '$webroot/index.html.next' '$webroot/index.html'"
