<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="CatChat: voice pipeline">
<rect width="1200" height="900" rx="24" fill="#100d25"/>
<g font-family="Arial, sans-serif">
<text x="70" y="92" fill="#915eff" font-size="20" letter-spacing="3">IMPLEMENTATION OVERVIEW</text>
<text x="70" y="156" fill="#ffffff" font-size="44" font-weight="700">CatChat: voice pipeline</text>
<text x="70" y="201" fill="#aaa6c3" font-size="22">Browser audio → transcription → response → speech</text>
<rect x="70" y="258" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="96" y="302" fill="#915eff" font-size="18">01</text>
<text x="96" y="342" fill="#ffffff" font-size="27" font-weight="700">Browser / WebRTC</text>
<text x="96" y="381" fill="#ccc5df" font-size="21">A Pipecat transport receives</text>
<text x="96" y="408" fill="#ccc5df" font-size="21">microphone audio and returns spoken</text>
<text x="96" y="435" fill="#ccc5df" font-size="21">responses.</text>
<rect x="620" y="258" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="646" y="302" fill="#915eff" font-size="18">02</text>
<text x="646" y="342" fill="#ffffff" font-size="27" font-weight="700">Speech recognition</text>
<text x="646" y="381" fill="#ccc5df" font-size="21">Whisper locally or Deepgram converts</text>
<text x="646" y="408" fill="#ccc5df" font-size="21">incoming speech into text.</text>
<rect x="70" y="503" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="96" y="547" fill="#915eff" font-size="18">03</text>
<text x="96" y="587" fill="#ffffff" font-size="27" font-weight="700">Language model</text>
<text x="96" y="626" fill="#ccc5df" font-size="21">Ollama locally or OpenAI generates a</text>
<text x="96" y="653" fill="#ccc5df" font-size="21">response using conversation context.</text>
<rect x="620" y="503" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="646" y="547" fill="#915eff" font-size="18">04</text>
<text x="646" y="587" fill="#ffffff" font-size="27" font-weight="700">Speech synthesis</text>
<text x="646" y="626" fill="#ccc5df" font-size="21">Piper, Cartesia, or a configured local</text>
<text x="646" y="653" fill="#ccc5df" font-size="21">HTTP service generates reply audio.</text>
<text x="70" y="795" fill="#aaa6c3" font-size="21">Architecture diagram based on the application source. Pipecat provides the</text>
<text x="70" y="824" fill="#aaa6c3" font-size="21">underlying pipeline and transport framework.</text>
</g></svg>