<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="LeapTalkAvatar: local pipeline">
<rect width="1200" height="900" rx="24" fill="#100d25"/>
<g font-family="Arial, sans-serif">
<text x="70" y="92" fill="#915eff" font-size="20" letter-spacing="3">IMPLEMENTATION OVERVIEW</text>
<text x="70" y="156" fill="#ffffff" font-size="44" font-weight="700">LeapTalkAvatar: local pipeline</text>
<text x="70" y="201" fill="#aaa6c3" font-size="22">Typed conversation → spoken response → animated avatar</text>
<rect x="70" y="258" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="96" y="302" fill="#915eff" font-size="18">01</text>
<text x="96" y="342" fill="#ffffff" font-size="27" font-weight="700">Chat and session</text>
<text x="96" y="381" fill="#ccc5df" font-size="21">A FastAPI application coordinates</text>
<text x="96" y="408" fill="#ccc5df" font-size="21">local LLM responses and conversation</text>
<text x="96" y="435" fill="#ccc5df" font-size="21">history.</text>
<rect x="620" y="258" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="646" y="302" fill="#915eff" font-size="18">02</text>
<text x="646" y="342" fill="#ffffff" font-size="27" font-weight="700">Speech synthesis</text>
<text x="646" y="381" fill="#ccc5df" font-size="21">Local TTS produces the audio used by</text>
<text x="646" y="408" fill="#ccc5df" font-size="21">the avatar renderer.</text>
<rect x="70" y="503" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="96" y="547" fill="#915eff" font-size="18">03</text>
<text x="96" y="587" fill="#ffffff" font-size="27" font-weight="700">Avatar rendering</text>
<text x="96" y="626" fill="#ccc5df" font-size="21">The upstream LeapTalk renderer</text>
<text x="96" y="653" fill="#ccc5df" font-size="21">animates a selected portrait from</text>
<text x="96" y="680" fill="#ccc5df" font-size="21">speech audio.</text>
<rect x="620" y="503" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="646" y="547" fill="#915eff" font-size="18">04</text>
<text x="646" y="587" fill="#ffffff" font-size="27" font-weight="700">Media assembly</text>
<text x="646" y="626" fill="#ccc5df" font-size="21">Concatenate video frames and mux one</text>
<text x="646" y="653" fill="#ccc5df" font-size="21">continuous WAV to avoid chunk audio</text>
<text x="646" y="680" fill="#ccc5df" font-size="21">drift.</text>
<text x="70" y="795" fill="#aaa6c3" font-size="21">Scott’s work is the application, integration, and media orchestration around</text>
<text x="70" y="824" fill="#aaa6c3" font-size="21">upstream models. Playback follows generation.</text>
</g></svg>