<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="CatChat: local TTS adapter">
<rect width="1200" height="900" rx="24" fill="#100d25"/>
<g font-family="Arial, sans-serif">
<text x="70" y="92" fill="#915eff" font-size="20" letter-spacing="3">IMPLEMENTATION OVERVIEW</text>
<text x="70" y="156" fill="#ffffff" font-size="44" font-weight="700">CatChat: local TTS adapter</text>
<text x="70" y="201" fill="#aaa6c3" font-size="22">One integration for multiple HTTP speech services</text>
<rect x="70" y="258" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="96" y="302" fill="#915eff" font-size="18">01</text>
<text x="96" y="342" fill="#ffffff" font-size="27" font-weight="700">Request mapping</text>
<text x="96" y="381" fill="#ccc5df" font-size="21">Map text and voice fields to the JSON</text>
<text x="96" y="408" fill="#ccc5df" font-size="21">contract expected by a local service.</text>
<rect x="620" y="258" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="646" y="302" fill="#915eff" font-size="18">02</text>
<text x="646" y="342" fill="#ffffff" font-size="27" font-weight="700">Service options</text>
<text x="646" y="381" fill="#ccc5df" font-size="21">Merge extra JSON fields for reference</text>
<text x="646" y="408" fill="#ccc5df" font-size="21">audio, language, and model options.</text>
<rect x="70" y="503" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="96" y="547" fill="#915eff" font-size="18">03</text>
<text x="96" y="587" fill="#ffffff" font-size="27" font-weight="700">Audio streaming</text>
<text x="96" y="626" fill="#ccc5df" font-size="21">Read response chunks and feed them</text>
<text x="96" y="653" fill="#ccc5df" font-size="21">into Pipecat audio frames.</text>
<rect x="620" y="503" width="510" height="205" rx="20" fill="#1d1538" stroke="#915eff" stroke-opacity=".6"/>
<text x="646" y="547" fill="#915eff" font-size="18">04</text>
<text x="646" y="587" fill="#ffffff" font-size="27" font-weight="700">Error handling</text>
<text x="646" y="626" fill="#ccc5df" font-size="21">Report HTTP errors, end speech frames,</text>
<text x="646" y="653" fill="#ccc5df" font-size="21">and close owned client sessions.</text>
<text x="70" y="795" fill="#aaa6c3" font-size="21">Custom application code integrates existing speech services. It does not train or</text>
<text x="70" y="824" fill="#aaa6c3" font-size="21">implement the speech models.</text>
</g></svg>